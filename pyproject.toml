[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "harmonsmile"
version = "0.1.1"
description = "Toolkit for harmonizing SMILES strings to canonical + isomeric + Kekulized convention (RDKit / COCONUT 2.0)"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Flavio F. Contreras-Torres", email = "contreras.flavio@tec.mx" }
]
keywords = ["cheminformatics", "SMILES", "RDKit", "COCONUT", "PubChem", "drug-discovery"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Lesser General Public License v3 or later (LGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
requires-python = ">=3.11"
dependencies = [
    "rdkit>=2022.09",
    "pandas>=2.0",
    "requests>=2.28",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "build>=1.0",
    "twine>=4.0",
]

[project.urls]
Homepage = "https://github.com/NanoBiostructuresRG/harmonsmile"
Repository = "https://github.com/NanoBiostructuresRG/harmonsmile"
Issues = "https://github.com/NanoBiostructuresRG/harmonsmile/issues"

[project.scripts]
harmonsmile = "harmonsmile._cli:main"

[tool.hatch.build.targets.wheel]
packages = ["harmonsmile"]

[tool.pytest.ini_options]
testpaths = ["tests"]
tmp_path_retention_count = 0
tmp_path_retention_policy = "none"
